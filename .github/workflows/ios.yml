name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (macOS Runner)
    runs-on: macos-14
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign)
        run: flutter build ios --no-codesign --release

      - name: Package iOS IPA & Runner Archive
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -9 Baganetic-v1.0.3.ipa Payload
          tar -czf Runner.app.tar.gz Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: baganetic-ios-ipa
          path: build/ios/iphoneos/Baganetic-v1.0.3.ipa
          retention-days: 14

      - name: Upload iOS App Archive
        uses: actions/upload-artifact@v4
        with:
          name: baganetic-ios-app
          path: build/ios/iphoneos/Runner.app.tar.gz
          retention-days: 14
